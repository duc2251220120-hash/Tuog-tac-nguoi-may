name: career_global
description: Career Global - Kết nối sự nghiệp · Vươn tầm thế giới
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Responsive sizing - pixel perfect trên mọi màn hình
  flutter_screenutil: ^5.9.3

  # Navigation
  go_router: ^14.2.7

  # Font chữ Inter
  google_fonts: ^6.2.1

  # Icon pack
  iconsax_flutter: ^1.0.1

  # Hiển thị ảnh từ network + cache
  cached_network_image: ^3.3.1

  # Loading skeleton animation
  shimmer: ^3.0.0

  # Indicator cho onboarding dots
  smooth_page_indicator: ^1.2.0

  # OTP input fields
  pin_code_fields: ^8.0.1

  # Charts/Analytics
  fl_chart: ^0.68.0

  # Date/time formatting
  intl: ^0.19.0

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
